# A generic, single database configuration.

[alembic]
# Path to migration scripts, relative to this file's location (backend/).
script_location = alembic

# Template for new migration file names.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# Timezone used when rendering the date in migration file headers.
timezone = UTC

# Adds backend/ to sys.path so that "from app.xxx import ..." works in env.py
prepend_sys_path = .

# Separator token between multiple values in version_locations.
version_path_separator = os

# ---------------------------------------------------------
# NOTE: sqlalchemy.url is intentionally left as a placeholder.
#       The real DATABASE_URL is injected by alembic/env.py
#       from pydantic-settings / .env — credentials are NEVER
#       committed to version control.
# ---------------------------------------------------------
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/litera


# ---------------------------------------------------------------------------
# Logging configuration
# ---------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
